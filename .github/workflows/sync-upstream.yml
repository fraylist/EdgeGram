name: Sync upstream Telegram

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM_URL: https://github.com/DrKLO/Telegram.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git identity and rerere
        run: |
          git config user.name "edgegram-sync"
          git config user.email "sync@users.noreply.github.com"
          git config rerere.enabled true

      - name: Fetch upstream
        id: up
        run: |
          git remote add upstream "$UPSTREAM_URL" || true
          git fetch --no-tags upstream master
          SHA=$(git rev-parse upstream/master)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Compare with recorded base
        id: check
        run: |
          BASE=$(cat docs/UPSTREAM_BASE.txt 2>/dev/null | tr -d '[:space:]' || true)
          if [ "$BASE" = "${{ steps.up.outputs.sha }}" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Уже синхронизировано с $BASE"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check history is connected
        id: ancestry
        if: steps.check.outputs.new == 'true'
        run: |
          if git merge-base main upstream/master >/dev/null 2>&1; then
            echo "connected=true" >> "$GITHUB_OUTPUT"
          else
            echo "connected=false" >> "$GITHUB_OUTPUT"
            echo "::error::История main не связана с апстримом. Выполни раздел 9.1 брифа."
          fi

      - name: Merge upstream
        id: merge
        if: steps.check.outputs.new == 'true' && steps.ancestry.outputs.connected == 'true'
        run: |
          git checkout -B "sync/upstream-${{ steps.up.outputs.short }}" main
          BEFORE=$(git rev-parse HEAD)
          if git merge --no-ff -m "Sync upstream Telegram @ ${{ steps.up.outputs.short }}" upstream/master; then
            if [ "$BEFORE" = "$(git rev-parse HEAD)" ]; then
              echo "::notice::Апстрим уже содержится в main — мержить нечего"
              echo "merged=false" >> "$GITHUB_OUTPUT"
            else
              echo "merged=true" >> "$GITHUB_OUTPUT"
            fi
            echo "${{ steps.up.outputs.sha }}" > docs/UPSTREAM_BASE.txt
            git add -A
            git diff --cached --quiet || git commit -m "docs: upstream base ${{ steps.up.outputs.short }}"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW=$(git rev-list --count main..HEAD)
          if [ "$NEW" = "0" ]; then
            echo "Нет изменений — PR не нужен"
            exit 0
          fi
          git push origin "HEAD:sync/upstream-${{ steps.up.outputs.short }}"
          if [ "${{ steps.merge.outputs.merged }}" = "true" ]; then
            TITLE="Sync upstream: ${{ steps.up.outputs.short }}"
            BODY="Автоматическое слияние апстрима. Проверь сборку и чек-лист из docs/UPSTREAM.md."
          else
            TITLE="Upstream base: ${{ steps.up.outputs.short }}"
            BODY="Апстрим уже содержится в main, обновлён только docs/UPSTREAM_BASE.txt."
          fi
          gh pr create \
            --base main \
            --head "sync/upstream-${{ steps.up.outputs.short }}" \
            --title "$TITLE" \
            --body "$BODY"

      - name: Report conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Конфликт при синхронизации апстрима ${{ steps.up.outputs.short }}" \
            --body "Автомерж не прошёл. Локально: git fetch upstream && git merge upstream/master. Разреши конфликты, проверь сборку, открой PR в main."
